<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            vertical-align: middle;
        }
        .form-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .form-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .form-scrollbar::-webkit-scrollbar-thumb {
            background: #cdc3d2;
            border-radius: 10px;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .underline-input {
            border: none;
            border-bottom: 1px solid #cdc3d2;
            background: transparent;
            padding: 8px 0;
            transition: all 0.3s ease;
        }
        .underline-input:focus {
            outline: none;
            border-bottom: 2px solid #431076;
            box-shadow: none;
        }
        .auth-shell {
            background: linear-gradient(135deg, #431076 0%, #232376 100%);
            min-height: 100vh;
        }
    </style>

<body class="bg-background text-on-background font-body-md overflow-hidden">
<!-- Auth Shell Background -->
<div class="auth-shell fixed inset-0 flex items-center justify-center p-md md:p-xl overflow-y-auto">
<!-- Floating shapes for atmosphere -->
<div class="absolute top-10 left-10 w-64 h-64 bg-primary-container/20 rounded-full blur-[100px] animate-pulse"></div>
<div class="absolute bottom-10 right-10 w-96 h-96 bg-tertiary-container/20 rounded-full blur-[120px] animate-pulse"></div>
<!-- Registration Container (The Card) -->
<div class="relative w-full max-w-[560px] glass-panel rounded-xl shadow-2xl flex flex-col max-h-[921px]">
<!-- Header Section -->
<div class="p-lg md:p-xl border-b border-outline-variant/20 text-center">
<div class="flex flex-col items-center gap-sm">
<div class="w-16 h-16 bg-surface-container-highest rounded-full flex items-center justify-center mb-xs">
<span class="material-symbols-outlined text-primary text-[40px]">local_library</span>
</div>
<div class="flex items-center gap-xs">
<h1 class="font-wordmark-md text-wordmark-md text-primary">Click &amp; Collect</h1>
</div>
<p class="font-label-caps text-label-caps text-outline tracking-widest uppercase">Member Registration</p>
</div>
</div>
<!-- Form Content (Scrollable) -->
<div class="flex-1 overflow-y-auto p-lg md:p-xl form-scrollbar">
<form class="space-y-lg" id="registrationForm">
<!-- Basic Info -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-lg">
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-primary">Full Name</label>
<input class="underline-input font-body-md" placeholder="Juan Dela Cruz" required="" type="text"/>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-primary">ID Number</label>
<input class="underline-input font-body-md" placeholder="2024-XXXX" required="" type="text"/>
</div>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-lg">
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-primary">LBC No.</label>
<input class="underline-input font-body-md" placeholder="Library Card No." required="" type="text"/>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-primary">Contact No.</label>
<input class="underline-input font-body-md" placeholder="09XX XXX XXXX" required="" type="tel"/>
</div>
</div>
<!-- Academic Info -->
<div class="grid grid-cols-1 md:grid-cols-3 gap-lg">
<div class="flex flex-col gap-xs md:col-span-1">
<label class="font-label-caps text-label-caps text-primary">Address</label>
<select class="underline-input font-body-md appearance-none">
<option value="">Select Municipality</option>
<option>Tangub City</option>
<option>Ozamiz City</option>
<option>Bonifacio</option>
<option>Tudela</option>
</select>
</div>
<div class="flex flex-col gap-xs md:col-span-1">
<label class="font-label-caps text-label-caps text-primary">Course</label>
<select class="underline-input font-body-md appearance-none">
<option value="">Select Course</option>
<option>BSIT</option>
<option>BSCS</option>
<option>BSED</option>
<option>BSHM</option>
</select>
</div>
<div class="flex flex-col gap-xs md:col-span-1">
<label class="font-label-caps text-label-caps text-primary">Year</label>
<select class="underline-input font-body-md appearance-none">
<option value="">Select Year</option>
<option>1st Year</option>
<option>2nd Year</option>
<option>3rd Year</option>
<option>4th Year</option>
</select>
</div>
</div>
<!-- Box-style Gmail Field -->
<div class="pt-md border-t border-outline-variant/10">
<div class="flex flex-col gap-sm">
<label class="font-label-caps text-label-caps text-primary">Institutional Gmail</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full pl-xl pr-md py-md bg-surface-container-low border border-outline-variant rounded-lg font-body-md focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all" placeholder="student.name@nmsc.edu.ph" required="" type="email"/>
</div>
<p class="text-[10px] text-outline italic">Must be a valid @nmsc.edu.ph address for verification.</p>
</div>
</div>
<!-- Confirmation Checkbox -->
<div class="flex items-start gap-md pt-sm">
<div class="flex items-center h-5">
<input class="w-4 h-4 text-primary bg-background border-outline-variant rounded focus:ring-primary" id="confirm" required="" type="checkbox"/>
</div>
<label class="text-label-sm font-label-sm text-on-surface-variant leading-tight" for="confirm">
                            I confirm that the information provided is accurate and I agree to the <span class="text-primary font-bold cursor-pointer hover:underline">Institutional Privacy Policy</span> of NMSC.
                        </label>
</div>
</form>
</div>
<!-- Footer Action -->
<div class="p-lg md:p-xl border-t border-outline-variant/20 bg-surface-container-lowest/50 rounded-b-xl">
<button class="w-full bg-primary text-on-primary py-md px-xl rounded-full font-headline-sm text-headline-sm hover:bg-primary-container hover:shadow-lg active:scale-95 transition-all flex items-center justify-center gap-sm group" form="registrationForm" type="submit">
                    Confirm Gmail
                    <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
<div class="mt-md text-center">
<p class="text-label-sm font-label-sm text-outline">Already have an account? <a class="text-primary font-bold hover:underline" href="#">Sign In</a></p>
</div>
</div>
</div>
</div>
<!-- Micro-interactions Script -->
<script>
        document.getElementById('registrationForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = e.target.closest('div').nextElementSibling.querySelector('button');
            const originalContent = btn.innerHTML;
            
            // Show loading state
            btn.disabled = true;
            btn.innerHTML = `
                <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                  <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                  <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                Verifying...
            `;

            setTimeout(() => {
                btn.innerHTML = `<span class="material-symbols-outlined">check_circle</span> Verification Sent`;
                btn.classList.replace('bg-primary', 'bg-status-available');
                
                setTimeout(() => {
                    alert('A verification link has been sent to your NMSC Gmail. Please check your inbox.');
                    btn.disabled = false;
                    btn.innerHTML = originalContent;
                    btn.classList.replace('bg-status-available', 'bg-primary');
                }, 1500);
            }, 2000);
        });

        // Add float animation to background shapes
        document.addEventListener('mousemove', (e) => {
            const moveX = (e.clientX - window.innerWidth / 2) * 0.01;
            const moveY = (e.clientY - window.innerHeight / 2) * 0.01;
            document.querySelectorAll('.absolute.rounded-full').forEach(shape => {
                shape.style.transform = `translate(${moveX}px, ${moveY}px)`;
            });
        });
    </script>
</body></html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Users — Click &amp; Collect</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <link rel="stylesheet" href="/styles/admin/admin_shared.css">
  <link rel="stylesheet" href="/styles/admin/admin_management.css">
</head>
<body data-page="users">
  <div class="app-wrapper">
  <div id="navbar-placeholder"></div>
  <div class="main-layout">
    <div id="sidebar-placeholder"></div>
    <main class="page-content users-main">
      <div class="users-actions-row">
        <div class="card course-card">
          <h3>Add Course</h3>
          <div class="input-row">
            <button class="btn-save-green" id="save-course-btn"></button>
            <input type="text" id="new-course" placeholder="Course name" class="input-box">
            <button class="icon-btn">✎</button>
          </div>
          <label>Course List:</label>
          <div class="deletable-list" id="course-list"></div>
        </div>
        <div class="card users-filter-card">
          <h3>Filter Users</h3>
          <div class="input-row">
            <label for="user-type-filter">Sort By:</label>
            <select id="user-type-filter" class="filter-select">
              <option value="all">All</option>
              <option value="admin">Admin</option>
              <option value="student">Student</option>
            </select>
          </div>
        </div>
        <button class="add-admin-btn">Add Admin +</button>
      </div>
      <div class="users-table-wrapper users-table-card">
        <h3>List of Registered Users</h3>
        <table class="data-table" id="users-table"><thead><tr><th>ID No.</th><th>Full Name</th><th>LBC No.</th><th>Gmail account</th><th>Address</th></tr></thead><tbody></tbody></table>
      </div>
    </main>
  </div>
  <div id="admin-form-modal" class="modal-overlay">
    <form class="modal-card" id="admin-register-form">
      <h3>Add Admin</h3>
      <div class="registration-grid">
        <input class="input-box" name="student_id" placeholder="ID No." required>
        <input class="input-box" name="lbc_no" placeholder="LBC No.">
        <input class="input-box" name="full_name" placeholder="Full Name" required>
        <input class="input-box" name="gmail" type="email" placeholder="Gmail account" required>
        <input class="input-box" name="address" placeholder="Address">
        <input class="input-box" name="contact_no" placeholder="Contact No.">
        <select class="input-select" id="admin-course" name="course"><option value="N/A">Course</option></select>
        <input class="input-box" name="year_level" placeholder="Year Level">
        <input class="input-box" name="password" type="password" placeholder="Password" required>
      </div>
      <div class="modal-actions">
        <button type="button" class="action-btn" data-close-modal>Cancel</button>
        <button type="submit" class="action-btn primary-btn">Save Admin</button>
      </div>
    </form>
  </div>
  <div id="edit-user-modal" class="modal-overlay">
    <form class="modal-card" id="edit-user-form">
      <h3>Edit User LBC Number</h3>
      <input type="hidden" id="edit-user-id">
      <p id="edit-user-name"></p>
      <input class="input-box" id="edit-lbc-no" placeholder="LBC No.">
      <div class="modal-actions">
        <button type="button" class="action-btn" data-close-modal>Cancel</button>
        <button type="submit" class="action-btn primary-btn">Update</button>
      </div>
    </form>
  </div>
  <div id="footer-placeholder"></div>
  <script src="/scripts/shared/components.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const page = document.body.dataset.page;
      loadComponent('#navbar-placeholder', '/components/navbar.html', () => { setActiveNav(page); initHamburger(); initNavSearch(); });
      loadComponent('#sidebar-placeholder', '/components/sidebar.html', () => initSidebar(page));
      loadComponent('#footer-placeholder', '/components/footer.html', () => startClock());
    });
  </script>
  <script src="/scripts/admin/users.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Click &amp; Collect — Manage Books</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="stylesheet" href="/styles/admin/admin_shared.css">
  <link rel="stylesheet" href="/styles/admin/admin_Bookmanagement.css">
</head>
<body>
<div class="app-shell">
  <header class="top-header-bar"><span class="header-portal-label">/ Librarian Portal /</span><div class="header-brand"><span class="header-brand-text">Click &amp; Collect</span><i class="ti ti-book-2 header-brand-icon"></i></div></header>
  <nav class="navbar"><div class="navbar-left"><span class="dot" style="background:#FF5F57"></span><span class="dot" style="background:#FEBC2E"></span><span class="dot" style="background:#28C840"></span></div><div class="navbar-center"><a href="/admin/dashboard" class="nav-icon-btn"><i class="ti ti-home"></i></a><button class="nav-icon-btn"><i class="ti ti-info-circle"></i></button><button class="nav-icon-btn"><i class="ti ti-switch-horizontal"></i></button><button class="nav-icon-btn"><i class="ti ti-id-badge-2"></i></button><div class="search-wrapper"><input type="text" class="search-bar" placeholder="Search..."><button class="search-clear"><i class="ti ti-x"></i></button></div></div><div class="navbar-right"><button class="nav-icon-btn"><i class="ti ti-bell"></i></button><div class="hamburger-wrapper"><button class="nav-icon-btn hamburger-btn"><i class="ti ti-menu-2"></i></button><div class="hamburger-dropdown"><a href="/logout"><i class="ti ti-logout"></i> Log Out</a></div></div></div></nav>
  <div class="main-layout">
    <aside class="sidebar" id="sidebar"><div class="sidebar-toggle" id="sidebarToggle"><i class="ti ti-chevron-left" id="sidebarChevron"></i></div><nav class="sidebar-nav"><a href="/admin/dashboard" id="nav-dashboard"><i class="ti ti-layout-dashboard"></i><span>Dashboard</span></a><a href="/admin/books" id="nav-books"><i class="ti ti-books"></i><span>Manage Books</span></a><a href="/admin/users" id="nav-users"><i class="ti ti-users"></i><span>Manage Users</span></a><a href="/admin/security" id="nav-security"><i class="ti ti-shield-lock"></i><span>Web Security</span></a></nav></aside>
    <main class="page-content">
      <div class="books-top-row"><div class="gold-panel"><div class="gold-panel-title">Add Books</div><div class="form-row" style="margin-bottom:8px;"><input type="text" class="form-input" id="book-title" placeholder="Title" style="flex:1"><button class="icon-btn" id="save-book-btn"><i class="ti ti-external-link"></i></button></div><div class="form-row"><select class="form-select" id="book-category" style="flex:1"><option value="">Category</option></select><input type="text" class="form-input" id="book-no" placeholder="Book No." style="flex:1"><button class="icon-btn" id="add-book-btn"><i class="ti ti-external-link"></i></button></div></div><div class="gold-panel"><div class="gold-panel-title">Add Category</div><div class="form-row" style="margin-bottom:8px;"><span class="color-dot-green"></span><input type="text" class="form-input" id="new-category" placeholder="Category name" style="flex:1"><button class="icon-btn" id="save-category-btn"><i class="ti ti-external-link"></i></button></div><div class="form-row"><label class="form-label">Category List:</label><select class="form-select" style="flex:1" id="category-list-select"><option value="">— Select —</option></select></div></div></div>
      <div class="gold-panel" style="flex:1;display:flex;flex-direction:column;"><div class="panel-header-row"><span class="gold-panel-title" style="margin:0;border:none;padding:0;">List of Books</span><div class="panel-header-controls"><div class="search-wrapper-sm"><i class="ti ti-search" style="font-size:13px;color:#888;"></i><input type="text" class="search-bar-sm" id="books-search" placeholder="Search books..."><button class="search-clear-sm" id="books-search-clear"><i class="ti ti-x"></i></button></div><label class="form-label">Sort By:</label><select class="form-select-sm" id="book-status-filter"><option value="all">All</option><option value="reserved" selected>Reserved</option><option value="borrowed">Borrowed</option><option value="available">Available</option></select></div></div><div style="margin-top:10px;flex:1;overflow-y:auto;"><table class="data-table" id="books-table"><thead><tr><th style="width:15%">Book No.</th><th style="width:35%">Title</th><th style="width:25%">Category</th><th style="width:25%">Status</th></tr></thead><tbody id="books-tbody"></tbody></table></div></div>
    </main>
  </div>
  <footer class="footer"><div class="footer-left"><img src="/public/assets/logo/nmscst-seal.png" alt="NMSCST" class="footer-logo"><div class="footer-school-name"><p>North Western Mindanao State</p><p>College of Science and Technology</p></div></div><div class="footer-center"><span class="footer-brand-text">Click &amp; Collect</span><i class="ti ti-book-2 footer-brand-icon"></i></div><div class="footer-right"><a href="#" class="footer-map-link"><i class="ti ti-map-pin"></i> LOCATION LINK (MAP)</a><span id="footer-date"></span><span id="footer-day"></span><span id="footer-time"></span></div></footer>
</div>
<script src="/scripts/admin/shared_init.js"></script>
<script src="/scripts/admin/books.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Books — Click &amp; Collect</title>
  <link rel="stylesheet" href="/styles/main/welcome.css">
  <link rel="stylesheet" href="/styles/admin/admin_shared.css">
  <link rel="stylesheet" href="/styles/admin/admin_Bookmanagement.css">
</head>
<body class="admin-page" data-page="books">
  <div id="header-placeholder"></div>
  <div id="navbar-placeholder"></div>
  <div class="admin-body">
    <div id="sidebar-placeholder"></div>
    <main class="books-main main-content">
      <div class="top-actions-row">
        <div class="card add-books-card">
          <h3>Add Books</h3>
          <div class="input-row">
            <input type="text" id="book-title" placeholder="Title" class="input-box">
            <button class="icon-btn" id="save-book-btn">✎</button>
          </div>
          <div class="input-row">
            <select id="book-category" class="input-select"><option value="">Category</option></select>
            <input type="text" id="book-no" placeholder="Book No." class="input-box">
            <button class="btn-save-green" id="add-book-btn" title="Save book"></button>
          </div>
        </div>
        <div class="card add-category-card">
          <h3>Add Category</h3>
          <div class="input-row">
            <button class="btn-save-green" id="save-category-btn"></button>
            <input type="text" id="new-category" placeholder="Category name" class="input-box">
            <button class="icon-btn">✎</button>
          </div>
          <label>Category List:</label>
          <div class="deletable-list" id="category-list"></div>
        </div>
      </div>
      <div class="card books-table-card">
        <div class="table-tools">
          <h3>Books Table</h3>
          <select id="book-status-filter" class="filter-select">
            <option value="all">All</option>
            <option value="reserved">Reserved</option>
            <option value="available">Available</option>
            <option value="borrowed">Borrowed</option>
          </select>
        </div>
        <div class="table-header">Book No. | Title | Category | Status</div>
        <div class="table-body books-table" id="books-table"></div>
      </div>
    </main>
  </div>
  <div id="footer-placeholder"></div>
  <script src="/scripts/shared/components.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const page = document.body.dataset.page;
      loadComponent('#header-placeholder', '/components/header.html', () => setPortalLabel('/ Librarian Portal /'));
      loadComponent('#navbar-placeholder', '/components/navbar.html', () => { setActiveNav(page); initHamburger(); initNavSearch(); });
      loadComponent('#sidebar-placeholder', '/components/sidebar.html', () => initSidebar(page));
      loadComponent('#footer-placeholder', '/components/footer.html', () => startClock());
    });
  </script>
  <script src="/scripts/admin/books.js"></script>
</body>
</html>

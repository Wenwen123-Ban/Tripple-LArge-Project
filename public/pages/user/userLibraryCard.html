<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Digital Library Card And Account — Click & Collect</title>
  <link rel="stylesheet" href="/styles/user/user_shared.css">
  <link rel="stylesheet" href="/styles/user/user_card.css">
</head>
<body>
  <header class="user-header">
    <span class="portal-label">/ User Portal /</span>
    <div class="brand-lockup">
      <span class="brand-name">Click &amp; Collect</span>
      <img src="/assets/logo/Book_logo.png" class="brand-book" alt="Book Logo">
    </div>
    <div class="user-hamburger-wrap">
      <button class="hamburger-btn" id="hamburger-btn">☰</button>
      <div class="user-hamburger-menu" id="hamburger-menu">
        <a href="/main/sign_in" class="hamburger-menu-item logout">Log Out</a>
        <a href="/main/help" class="hamburger-menu-item">Help</a>
        <a href="/main/about" class="hamburger-menu-item">About</a>
      </div>
    </div>
  </header>

  <div class="page-label-bar">Digital Library Card And Account</div>

  <div class="user-body">
    <aside class="user-sidebar">
      <a href="/user/books" class="sidebar-icon-btn" title="Home">⌂</a>
      <a href="/user/manage" class="sidebar-icon-btn" title="Manage">📖</a>
      <a href="/user/card" class="sidebar-icon-btn active" title="Card">💳</a>
      <a href="/user/notifications" class="sidebar-icon-btn" title="Notifications">🔔</a>
    </aside>

    <main class="user-main">
      <div class="card-layout">
        <div class="library-card">
          <div class="binary-top" id="binary-top"></div>
          <div class="binary-left" id="binary-left"></div>
          <div class="card-content">
            <p class="card-title-label"><em>Digital Library Card</em></p>
            <div id="c-name"></div>
            <div id="c-id"></div>
            <div id="c-lbc"></div>
            <div id="c-course"></div>
            <div id="c-year"></div>
            <div id="c-verified"></div>
            <div id="c-issued"></div>
          </div>
        </div>

        <div class="card-transactions">
          <div class="transaction-header">
            <span>Date Borrowed</span>
            <span>Book No.</span>
            <span>Accession No.</span>
            <span>Date Returned</span>
          </div>
          <div id="transaction-list"></div>
        </div>
      </div>
    </main>
  </div>

  <footer class="user-footer">
    <div class="footer-left">
      <img src="/assets/logo/NMSC LOGO.jpg" class="footer-seal" alt="School Logo">
      <span class="footer-school">
        North Western Mindanao State<br>
        College of Science and Technology
      </span>
    </div>
    <div class="footer-brand">
      <span class="brand-name">Click &amp; Collect</span>
      <img src="/assets/logo/Book_logo.png" class="brand-book" alt="Book Logo">
    </div>
    <div class="footer-right" id="footer-clock"></div>
  </footer>

  <script src="/scripts/user/main.js"></script>
  <script src="/scripts/user/account.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home — Click & Collect</title>
  <link rel="stylesheet" href="/styles/user/user_shared.css">
  <link rel="stylesheet" href="/styles/user/user_dashboard.css">
</head>
<body>
  <header class="user-header">
    <span class="portal-label">/ User Portal /</span>
    <div class="brand-lockup">
      <span class="brand-name">Click &amp; Collect</span>
      <img src="/assets/logo/Book_logo.png" class="brand-book" alt="Book Logo">
    </div>
    <div class="user-hamburger-wrap">
      <button class="hamburger-btn" id="hamburger-btn">☰</button>
      <div class="user-hamburger-menu" id="hamburger-menu">
        <a href="/main/sign_in" class="hamburger-menu-item logout">Log Out</a>
        <a href="/main/help" class="hamburger-menu-item">Help</a>
        <a href="/main/about" class="hamburger-menu-item">About</a>
      </div>
    </div>
  </header>

  <div class="page-label-bar">Home</div>

  <div class="user-body">
    <aside class="user-sidebar">
      <a href="/user/books" class="sidebar-icon-btn active" title="Home">H</a>
      <a href="/user/manage" class="sidebar-icon-btn" title="Manage">M</a>
      <a href="/user/card" class="sidebar-icon-btn" title="Card">C</a>
      <a href="/user/notifications" class="sidebar-icon-btn" title="Notifications">N</a>
    </aside>

    <main class="user-main">
      <div class="book-controls">
        <div class="search-wrap">
          <input 
            id="book-search" 
            class="book-search-input" 
            placeholder="Search books..." 
            type="text">
          <button id="book-search-clear" aria-label="Clear search">✕</button>
        </div>
        <select id="category-filter" class="category-select">
          <option value="all">Category</option>
        </select>
      </div>

      <div class="legend-strip">
        <span class="legend-item">
          <span class="legend-dot red"></span> 
          Borrowed
        </span>
        <span class="legend-item">
          <span class="legend-dot orange"></span> 
          Reserved
        </span>
        <span class="legend-item">
          <span class="legend-dot green"></span> 
          Available
        </span>
      </div>

      <div class="trending-row">
        <div class="trending-section">
          <h3 class="section-title">Trending Top 3 Borrowed</h3>
          <div class="trending-cards" id="top-borrowed"></div>
        </div>
        <div class="trending-section">
          <h3 class="section-title">Trending Top 3 Reserved</h3>
          <div class="trending-cards" id="top-reserved"></div>
        </div>
      </div>

      <div class="category-chips" id="category-chips"></div>
      <div class="book-grid" id="book-grid"></div>
      <div id="scroll-sentinel" style="height: 1px;"></div>
    </main>
  </div>

  <footer class="user-footer">
    <div class="footer-left">
      <img src="/assets/logo/NMSC LOGO.jpg" class="footer-seal" alt="School Logo">
      <span class="footer-school">
        North Western Mindanao State<br>
        College of Science and Technology
      </span>
    </div>
    <div class="footer-brand">
      <span class="brand-name">Click &amp; Collect</span>
      <img src="/assets/logo/Book_logo.png" class="brand-book" alt="Book Logo">
    </div>
    <div class="footer-right" id="footer-clock"></div>
  </footer>

  <script src="/scripts/user/main.js"></script>
  <script src="/scripts/user/reserve.js"></script>
  <script src="/scripts/user/books.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Recovery - Click &amp; Collect</title>
    <link rel="stylesheet" href="../../styles/main/recoveryform.css">
</head>
<body>
    <header class="top-bar" aria-label="Window controls">
        <div class="status-dots" aria-hidden="true">
            <span class="dot dot-blue"></span>
            <span class="dot dot-yellow"></span>
            <span class="dot dot-red"></span>
        </div>
        <div class="center-lines" aria-hidden="true">
            <span class="center-line"></span>
            <span class="center-line"></span>
        </div>
        <button class="exit-button" type="button" aria-label="Return to welcome page" onclick="window.location.href = '/'">→</button>
    </header>

    <main class="page-content">
        <section class="form-card" aria-labelledby="recovery-title">
            <div class="card-header">
                <img src="../../assets/logo/NMSC LOGO.jpg" alt="NMSC seal" class="nmsc-seal">
                <a href="#" class="school-link">North Western Mindanao State College of Science and Technology</a>
                <div class="brand-lockup">
                    <span class="brand-name">Click &amp; Collect</span>
                    <img src="../../assets/logo/Book_logo.png" alt="" class="brand-book" aria-hidden="true">
                </div>
                <p class="form-subtitle" id="recovery-title">Account Recovery form</p>
            </div>

            <form id="recoveryForm" class="recovery-form">
                <div class="id-lbc-row">
                    <label class="box-field" for="id-input">
                        <span>ID No:</span>
                        <input type="text" id="id-input" name="id_no" class="input-box" placeholder="YYYY-NNNNN" maxlength="10" inputmode="numeric" autocomplete="off" spellcheck="false" required>
                        <span class="field-note">Year of enrollment – Entry number</span>
                    </label>
                    <label class="box-field" for="lbc-input">
                        <span>LBC No:</span>
                        <input type="text" id="lbc-input" name="lbc_no" class="input-box" placeholder="0000-00000" maxlength="14" inputmode="numeric" autocomplete="off" spellcheck="false">
                        <span class="field-note">Assigned by admin — check your LBC card</span>
                    </label>
                </div>

                <label class="box-field" for="recoveryGmail">
                    <span>Gmail:</span>
                    <input type="email" id="recoveryGmail" name="gmail" class="input-box" autocomplete="email" required>
                </label>

                <button type="button" id="send-recovery-code-btn" class="btn-primary">Send recovery code</button>

                <label class="box-field" for="recoveryPassword">
                    <span>Change password:</span>
                    <input type="password" id="recoveryPassword" name="new_password" class="input-box" autocomplete="new-password" required>
                </label>
                <p class="field-note">Use a new password that is easy for you to remember and hard for others to guess.</p>

                <label class="box-field" for="recoveryCode">
                    <span>Confirm recovery code:</span>
                    <input type="text" id="recoveryCode" name="recovery_code" class="input-box recovery-code" autocomplete="off" spellcheck="false" required>
                </label>
                <p class="field-note">Enter the code sent to your Gmail account to confirm account recovery.</p>

                <label class="box-field" for="recovery-key-input" id="recovery-key-row" style="display:none;">
                    <span>Recovery Key:</span>
                    <input type="text" id="recovery-key-input" name="recovery_key" class="input-box" placeholder="NMSC-ADM-XXXX-XXXX-XXXX-XXXX" autocomplete="off" spellcheck="false">
                    <span class="field-note">Admin accounts require the physical recovery key stored offline.</span>
                </label>

                <hr class="form-divider">
                <button type="submit" class="btn-primary">Done &amp; Sign in</button>
            </form>
        </section>
    </main>

    <script type="module" src="../../../scripts/main/recovery.js"></script>
</body>
</html>

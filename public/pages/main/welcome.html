<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - Click &amp; Collect</title>
    <link rel="stylesheet" href="../../styles/main/welcome.css">
</head>
<body>
    <div class="top-bar" aria-hidden="true">
        <div class="status-dots">
            <span class="dot dot-blue"></span>
            <span class="dot dot-yellow"></span>
            <span class="dot dot-red"></span>
        </div>
        <div class="center-lines">
            <span class="center-line"></span>
            <span class="center-line"></span>
        </div>
    </div>

    <main class="welcome-hero" aria-label="Click and Collect welcome page">
        <div class="hex-background" aria-hidden="true">
            <span class="decor-hex decor-hex-one"></span>
            <span class="decor-hex decor-hex-two"></span>
            <span class="decor-hex decor-hex-three"></span>
            <span class="decor-hex decor-hex-four"></span>
            <span class="decor-hex decor-hex-five"></span>
            <span class="decor-hex decor-hex-six"></span>
            <span class="decor-hex decor-hex-seven"></span>
            <span class="decor-hex decor-hex-eight"></span>
            <span class="decor-hex decor-hex-nine"></span>
        </div>

        <section class="welcome-copy" aria-labelledby="welcome-heading">
            <h1 id="welcome-heading" class="welcome-heading">WELCOME</h1>
            <p class="welcome-to">TO</p>
            <div class="brand-lockup">
                <span class="brand-name">Click &amp; Collect</span>
                <img src="../../assets/logo/Book_logo.png" alt="" class="brand-book" aria-hidden="true">
            </div>
        </section>

        <p class="signin-prompt">Click Anywhere in this page to Sign in</p>

        <aside class="attribution" aria-label="Institution attribution">
            <p class="made-for">MADE FOR</p>
            <img src="../../assets/logo/NMSC LOGO.jpg" alt="NMSC institutional seal" class="nmsc-seal">
            <a href="#" class="school-link">North Western Mindanao State College of Science and Technology</a>
        </aside>

        <div class="hex-icon-cluster" aria-hidden="true"></div>
    </main>

    <script src="../../../scripts/main/welcome.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form - Click &amp; Collect</title>
    <link rel="stylesheet" href="../../styles/main/registrationForm.css">
</head>
<body>
    <header class="top-bar" aria-label="Window controls">
        <div class="status-dots" aria-hidden="true">
            <span class="dot dot-blue"></span>
            <span class="dot dot-yellow"></span>
            <span class="dot dot-red"></span>
        </div>
        <div class="center-lines" aria-hidden="true">
            <span class="center-line"></span>
            <span class="center-line"></span>
        </div>
        <button class="exit-button" type="button" aria-label="Return to welcome page" onclick="window.location.href = '/'">→</button>
    </header>

    <main class="page-content">
        <section class="form-card" aria-labelledby="registration-title">
            <div class="card-header">
                <img src="../../assets/logo/NMSC LOGO.jpg" alt="NMSC seal" class="nmsc-seal">
                <a href="#" class="school-link">North Western Mindanao State College of Science and Technology</a>
                <div class="brand-lockup">
                    <span class="brand-name">Click &amp; Collect</span>
                    <img src="../../assets/logo/Book_logo.png" alt="" class="brand-book" aria-hidden="true">
                </div>
                <p class="form-subtitle" id="registration-title">Registration form</p>
            </div>

            <form id="registrationForm" class="registration-form">
                <label class="underline-field" for="registrationName">
                    <span>Name:</span>
                    <input type="text" id="registrationName" name="name" class="input-underline" autocomplete="name" required>
                </label>

                <div class="id-lbc-row">
                    <label class="underline-field field-with-hint" for="id-input">
                        <span>ID No:</span>
                        <input type="text" id="id-input" name="id_no" class="input-underline" placeholder="YYYY-NNNNN" maxlength="10" inputmode="numeric" autocomplete="off" required>
                        <span class="input-hint">Year of enrollment – Entry number</span>
                    </label>
                    <label class="underline-field field-with-hint" for="lbc-input">
                        <span>LBC No:</span>
                        <input type="text" id="lbc-input" name="lbc_no" class="input-underline" placeholder="0000-00000" maxlength="14" inputmode="numeric" autocomplete="off">
                        <span class="input-hint">Assigned by admin — check your LBC card</span>
                    </label>
                </div>

                <div class="underline-field">
                    <span>Address:</span>
                    <div class="address-wrap">
                        <select id="address-select" name="address" class="input-select" required>
                            <option value="">— Select Barangay/Area —</option>
                            <optgroup label="Urban Barangays (Poblacion)">
                                <option value="Barangay I - City Hall">Barangay I - City Hall</option>
                                <option value="Barangay II - Marilou Annex">Barangay II - Marilou Annex</option>
                                <option value="Barangay III - Market Kalubian">Barangay III - Market Kalubian</option>
                                <option value="Barangay IV - St. Michael">Barangay IV - St. Michael</option>
                                <option value="Barangay V - Malubog">Barangay V - Malubog</option>
                                <option value="Barangay VI - Lower Polao">Barangay VI - Lower Polao</option>
                                <option value="Barangay VII - Upper Polao">Barangay VII - Upper Polao</option>
                            </optgroup>
                            <optgroup label="Rural Barangays">
                                <option value="Aquino">Aquino</option>
                                <option value="Balatacan">Balatacan</option>
                                <option value="Baluc">Baluc</option>
                                <option value="Banglay">Banglay</option>
                                <option value="Bintana">Bintana</option>
                                <option value="Bocator">Bocator</option>
                                <option value="Bongabong">Bongabong</option>
                                <option value="Caniangan">Caniangan</option>
                                <option value="Capalaran">Capalaran</option>
                                <option value="Catagan">Catagan</option>
                                <option value="Garang">Garang</option>
                                <option value="Guinabot">Guinabot</option>
                                <option value="Guinalaban">Guinalaban</option>
                                <option value="Huyohoy (also spelled Hoyohoy)">Huyohoy (also spelled Hoyohoy)</option>
                                <option value="Isidro D. Tan (Dimalooc)">Isidro D. Tan (Dimalooc)</option>
                                <option value="Kauswagan (also spelled Kausawagan)">Kauswagan (also spelled Kausawagan)</option>
                                <option value="Kimat">Kimat</option>
                                <option value="Labuyo">Labuyo</option>
                                <option value="Lorenzo Tan">Lorenzo Tan</option>
                                <option value="Lumban">Lumban</option>
                                <option value="Maloro">Maloro</option>
                                <option value="Manga">Manga</option>
                                <option value="Mantic">Mantic</option>
                                <option value="Maquilao">Maquilao</option>
                                <option value="Matugnaw (also spelled Matugnao)">Matugnaw (also spelled Matugnao)</option>
                                <option value="Migcanaway">Migcanaway</option>
                                <option value="Minsubong">Minsubong</option>
                                <option value="Owayan">Owayan</option>
                                <option value="Paiton">Paiton</option>
                                <option value="Panalsalan">Panalsalan</option>
                                <option value="Pangabuan">Pangabuan</option>
                                <option value="Prenza">Prenza</option>
                                <option value="Salimpuno">Salimpuno</option>
                                <option value="San Antonio">San Antonio</option>
                                <option value="San Apolinario">San Apolinario</option>
                                <option value="San Vicente">San Vicente</option>
                                <option value="Santa Cruz">Santa Cruz</option>
                                <option value="Santa Maria (Baga)">Santa Maria (Baga)</option>
                                <option value="Santo Niño">Santo Niño</option>
                                <option value="Sicot">Sicot</option>
                                <option value="Silanga">Silanga</option>
                                <option value="Silangit">Silangit</option>
                                <option value="Simasay">Simasay</option>
                                <option value="Sumirap">Sumirap</option>
                                <option value="Taguite">Taguite</option>
                                <option value="Tituron">Tituron</option>
                                <option value="Tugas">Tugas</option>
                                <option value="Villaba">Villaba</option>
                            </optgroup>
                            <optgroup label="Nearby Cities/Municipalities">
                                <option value="Ozamiz City">Ozamiz City</option>
                                <option value="Oroquieta City">Oroquieta City</option>
                                <option value="Jimenez">Jimenez</option>
                                <option value="Plaridel">Plaridel</option>
                                <option value="Baliangao">Baliangao</option>
                                <option value="Bonifacio">Bonifacio</option>
                                <option value="Clarin">Clarin</option>
                                <option value="Sapang Dalaga">Sapang Dalaga</option>
                                <option value="Tudela">Tudela</option>
                                <option value="Don Victoriano Agustin">Don Victoriano Agustin</option>
                            </optgroup>
                            <option value="other">Other (specify below)</option>
                        </select>
                        <input type="text" id="address-other" class="input-underline" placeholder="Enter your complete address" style="display:none;margin-top:8px;" maxlength="255" />
                    </div>
                </div>

                <div class="course-year-row">
                    <label class="select-field" for="course-select">
                        <span>Course:</span>
                        <select id="course-select" name="course" class="input-select" required>
                            <option value="NA" selected>N/A</option>
                        </select>
                    </label>
                    <label class="select-field" for="year-select">
                        <span>Year:</span>
                        <select id="year-select" name="year" class="input-select" required>
                            <option value="">Year</option>
                        </select>
                    </label>
                </div>

                <label class="underline-field" for="registrationContactNo">
                    <span>Contact No:</span>
                    <input type="tel" id="registrationContactNo" name="contact_no" class="input-underline" inputmode="numeric" autocomplete="tel" required>
                </label>

                <label class="box-field" for="registrationGmail">
                    <span>Gmail:</span>
                    <input type="email" id="registrationGmail" name="gmail" class="input-gmail" autocomplete="email" required>
                </label>

                <label class="underline-field" for="registrationPassword">
                    <span>Password:</span>
                    <input type="password" id="registrationPassword" name="password" class="input-underline" autocomplete="new-password" required>
                </label>

                <label class="checkbox-row" for="registrationAgreement">
                    <input type="checkbox" id="registrationAgreement" name="agreement" required readonly>
                    <span>I confirm that the information provided is accurate and that this Gmail account can receive my verification and account notices.</span>
                </label>

                <hr class="form-divider">
                <button type="button" id="confirm-gmail-btn" class="btn-primary">Confirm gmail</button>
                <p class="form-note">A confirmation code will be sent to your Gmail account before registration is finalized.</p>
            </form>
        </section>
    </main>

    <script type="module" src="../../../scripts/main/registration.js"></script>
</body>
</html>

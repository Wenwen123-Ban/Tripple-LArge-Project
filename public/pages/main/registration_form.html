<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form - Click &amp; Collect</title>
    <link rel="stylesheet" href="../../styles/main/registrationForm.css">
</head>
<body>
    <header class="top-bar" aria-label="Window controls">
        <div class="status-dots" aria-hidden="true">
            <span class="dot dot-blue"></span>
            <span class="dot dot-yellow"></span>
            <span class="dot dot-red"></span>
        </div>
        <div class="center-lines" aria-hidden="true">
            <span class="center-line"></span>
            <span class="center-line"></span>
        </div>
        <button class="exit-button" type="button" aria-label="Return to welcome page" onclick="window.location.href = '/'">→</button>
    </header>

    <main class="page-content">
        <section class="form-card" aria-labelledby="registration-title">
            <div class="card-header">
                <img src="../../assets/logo/NMSC LOGO.jpg" alt="NMSC seal" class="nmsc-seal">
                <a href="#" class="school-link">North Western Mindanao State College of Science and Technology</a>
                <div class="brand-lockup">
                    <span class="brand-name">Click &amp; Collect</span>
                    <img src="../../assets/logo/Book_logo.png" alt="" class="brand-book" aria-hidden="true">
                </div>
                <p class="form-subtitle" id="registration-title">Registration form</p>
            </div>

            <form id="registrationForm" class="registration-form">
                <label class="underline-field" for="registrationName">
                    <span>Name:</span>
                    <input type="text" id="registrationName" name="name" class="input-underline" autocomplete="name" required>
                </label>

                <div class="id-lbc-row">
                    <label class="underline-field field-with-hint" for="id-input">
                        <span>ID No:</span>
                        <input type="text" id="id-input" name="id_no" class="input-underline" placeholder="YYYY-NNNNN" maxlength="10" inputmode="numeric" autocomplete="off" required>
                        <span class="input-hint">Year of enrollment – Entry number</span>
                    </label>
                    <label class="underline-field field-with-hint" for="lbc-input">
                        <span>LBC No:</span>
                        <input type="text" id="lbc-input" name="lbc_no" class="input-underline" placeholder="0000-00000" maxlength="14" inputmode="numeric" autocomplete="off">
                        <span class="input-hint">Assigned by admin — check your LBC card</span>
                    </label>
                </div>

                <div class="underline-field">
                    <span>Address:</span>
                    <div class="address-wrap">
                        <select id="address-select" name="address" class="input-select" required>
                            <option value="">— Select Barangay/Area —</option>
                            <optgroup label="Tangub City"><option>Banglay</option><option>Bintana</option><option>Bocator</option><option>Capalaran</option><option>Gata</option><option>Guinabsan</option><option>Isidto</option><option>Labuon</option><option>Liloan</option><option>Maloro</option><option>Mantic</option><option>Migcanaway</option><option>Minsubong</option><option>Oroquieta</option><option>Pangabuan</option><option>Punta</option><option>Salimpuno</option><option>San Antonio</option><option>Santa Cruz</option><option>Titulan</option><option>Silanga</option><option>Taguite</option><option>Poblacion</option></optgroup>
                            <optgroup label="Nearby Areas"><option>Ozamiz City</option><option>Oroquieta City</option><option>Jimenez</option><option>Plaridel</option><option>Baliangao</option><option>Bonifacio</option><option>Clarin</option><option>Sapang Dalaga</option><option>Tudela</option><option>Don Victoriano</option></optgroup>
                            <option value="other">Other (specify)</option>
                        </select>
                        <input type="text" id="address-other" class="input-underline" placeholder="Type your address" style="display:none;margin-top:6px;" />
                    </div>
                </div>

                <div class="course-year-row">
                    <label class="select-field" for="course-select">
                        <span>Course:</span>
                        <select id="course-select" name="course" class="input-select" required>
                            <option value="NA" selected>N/A</option>
                        </select>
                    </label>
                    <label class="select-field" for="year-select">
                        <span>Year:</span>
                        <select id="year-select" name="year" class="input-select" required>
                            <option value="">Year</option>
                        </select>
                    </label>
                </div>

                <label class="underline-field" for="registrationContactNo">
                    <span>Contact No:</span>
                    <input type="tel" id="registrationContactNo" name="contact_no" class="input-underline" inputmode="numeric" autocomplete="tel" required>
                </label>

                <label class="box-field" for="registrationGmail">
                    <span>Gmail:</span>
                    <input type="email" id="registrationGmail" name="gmail" class="input-gmail" autocomplete="email" required>
                </label>

                <label class="underline-field" for="registrationPassword">
                    <span>Password:</span>
                    <input type="password" id="registrationPassword" name="password" class="input-underline" autocomplete="new-password" required>
                </label>

                <label class="checkbox-row" for="registrationAgreement">
                    <input type="checkbox" id="registrationAgreement" name="agreement" required readonly>
                    <span>I confirm that the information provided is accurate and that this Gmail account can receive my verification and account notices.</span>
                </label>

                <hr class="form-divider">
                <button type="button" id="confirm-gmail-btn" class="btn-primary">Confirm gmail</button>
                <p class="form-note">A confirmation code will be sent to your Gmail account before registration is finalized.</p>
            </form>
        </section>
    </main>

    <script type="module" src="../../../scripts/main/registration.js"></script>
</body>
</html>
